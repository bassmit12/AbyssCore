apiVersion: apps/v1
kind: Deployment
metadata:
  name: abysscore-frontend
  namespace: abysscore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abysscore-frontend
  template:
    metadata:
      labels:
        app: abysscore-frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/bassmit12/abysscore-frontend:latest
        env:
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: abysscore-frontend
  namespace: abysscore
spec:
  type: NodePort
  selector:
    app: abysscore-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000