apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: abysscore-tracing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bassmit12/AbyssCore.git
    targetRevision: HEAD
    path: infra/k8s/otel
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
