apiVersion: apps/v1
kind: Deployment
metadata:
  name: abysscore-backend
  namespace: abysscore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abysscore-backend
  template:
    metadata:
      labels:
        app: abysscore-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      - name: wait-for-postgres
        image: busybox
        command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']
      containers:
      - name: backend
        image: ghcr.io/bassmit12/abysscore-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: abysscore-backend
  namespace: abysscore
spec:
  selector:
    app: abysscore-backend
  ports:
  - port: 4000
    targetPort: 4000