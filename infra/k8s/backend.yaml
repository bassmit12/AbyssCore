apiVersion: apps/v1
kind: Deployment
metadata:
  name: abysscore-backend
  namespace: abysscore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abysscore-backend
  template:
    metadata:
      labels:
        app: abysscore-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/bassmit12/abysscore-backend:latest
        imagePullPolicy: Always
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        ports:
        - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: abysscore-backend
  namespace: abysscore
spec:
  selector:
    app: abysscore-backend
  ports:
  - port: 4000
    targetPort: 4000