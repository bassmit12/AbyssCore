apiVersion: apps/v1
kind: Deployment
metadata:
  name: abysscore-backend
  namespace: abysscore
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: abysscore-backend
  template:
    metadata:
      labels:
        app: abysscore-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/bassmit12/abysscore-backend:5f809e97393f02cdb69aaec1c037b499f0751e93
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: PORT
          value: "4000"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        - name: KEYCLOAK_ISSUER
          value: "https://abysscore-auth.bassmit.dev/realms/abysscore"
        ports:
        - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: abysscore-backend
  namespace: abysscore
  labels:
    app: abysscore-backend
spec:
  selector:
    app: abysscore-backend
  ports:
  - name: http
    port: 4000
    targetPort: 4000
