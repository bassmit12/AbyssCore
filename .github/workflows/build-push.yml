name: Build and Push Images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/k8s/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: bassmit12

jobs:
  build-backend:
    name: Build Backend (Encore)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> $GITHUB_PATH

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build backend image
        working-directory: backend
        run: |
          encore build docker \
            --config infra.config.json \
            ghcr.io/${{ env.OWNER }}/abysscore-backend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/abysscore-backend:${{ github.sha }}
          docker tag ghcr.io/${{ env.OWNER }}/abysscore-backend:${{ github.sha }} ghcr.io/${{ env.OWNER }}/abysscore-backend:latest
          docker push ghcr.io/${{ env.OWNER }}/abysscore-backend:latest

  build-gateway:
    name: Build Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./graphql-gateway
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/abysscore-gateway:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/abysscore-gateway:latest

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/abysscore-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/abysscore-frontend:latest
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_GRAPHQL_URL=https://abysscore-api.bassmit.dev/graphql
            NEXT_PUBLIC_GRAPHQL_WS_URL=wss://abysscore-api.bassmit.dev/graphql
            NEXT_PUBLIC_KEYCLOAK_URL=https://abysscore-auth.bassmit.dev
            NEXT_PUBLIC_KEYCLOAK_REALM=abysscore
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=abysscore-frontend

  update-manifests:
    name: Update K8s Image Tags
    runs-on: ubuntu-latest
    needs: [build-backend, build-gateway, build-frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Update image tags in manifests
        run: |
          SHA=${{ github.sha }}
          sed -i "s|abysscore-frontend:.*|abysscore-frontend:${SHA}|g" infra/k8s/frontend.yaml
          sed -i "s|abysscore-backend:.*|abysscore-backend:${SHA}|g" infra/k8s/backend.yaml
          sed -i "s|abysscore-gateway:.*|abysscore-gateway:${SHA}|g" infra/k8s/gateway.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/frontend.yaml infra/k8s/backend.yaml infra/k8s/gateway.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
