# AbyssCore GraphQL Schema — Slay the Spire edition

scalar Time

# ─── Auth ────────────────────────────────────────────────────────────────────

type User {
  id: ID!
  email: String!
  roles: [String!]!
}

# ─── Hero ────────────────────────────────────────────────────────────────────

enum HeroClass {
  WARRIOR
  ROGUE
  MAGE
}

type Hero {
  id: ID!
  name: String!
  class: HeroClass!
  hp: Int!
  maxHp: Int!
  level: Int!
  xp: Int!
  gold: Int!
  alive: Boolean!
  runId: ID
}

# ─── Map / Run ───────────────────────────────────────────────────────────────

enum NodeType {
  COMBAT
  ELITE
  BOSS
  REST
  SHOP
  TREASURE
  EVENT
}

type MapNode {
  id: ID!
  floor: Int!
  position: Int!
  type: NodeType!
  visited: Boolean!
  available: Boolean!
}

type MapEdge {
  fromNodeId: ID!
  toNodeId: ID!
}

type FloorGraph {
  runId: ID!
  heroId: ID!
  currentNodeId: ID
  nodes: [MapNode!]!
  edges: [MapEdge!]!
}

type Run {
  id: ID!
  heroId: ID!
  heroName: String!
  playerName: String!
  floorsCleared: Int!
  monstersKilled: Int!
  score: Int!
}

# ─── Card Combat ─────────────────────────────────────────────────────────────

enum CardType {
  ATTACK
  SKILL
  POWER
  STATUS
  CURSE
}

enum CardRarity {
  COMMON
  UNCOMMON
  RARE
}

type Card {
  id: ID!
  defId: ID!
  name: String!
  cost: Int!
  type: CardType!
  effect: String!
}

type CardDefinition {
  id: ID!
  name: String!
  class: String!
  type: CardType!
  cost: Int!
  effect: String!
  rarity: CardRarity!
  description: String!
}

type HeroDeck {
  heroId: ID!
  cards: [Card!]!
}

# ─── Relics ──────────────────────────────────────────────────────────────────

type Relic {
  id: ID!
  defId: ID!
  name: String!
  rarity: String!
  description: String!
}

# ─── Encounter (card combat) ─────────────────────────────────────────────────

type EncounterMonster {
  id: ID!
  name: String!
  hp: Int!
  maxHp: Int!
  block: Int!
  status: String!
  intents: [MonsterIntent!]!
}

type MonsterIntent {
  type: String!
  value: Int!
}

type HeroCombatState {
  hp: Int!
  maxHp: Int!
  block: Int!
  energy: Int!
  maxEnergy: Int!
  hand: [Card!]!
  drawPileCount: Int!
  discardPileCount: Int!
  statuses: [StatusEffect!]!
}

type StatusEffect {
  name: String!
  stacks: Int!
}

type EncounterState {
  encounterId: ID!
  heroState: HeroCombatState!
  monsters: [EncounterMonster!]!
  turnNumber: Int!
  status: String!
  message: String!
}

type CardRewards {
  encounterId: ID!
  cards: [CardDefinition!]!
}

type ShopInventory {
  items: [ShopItem!]!
}

type ShopItem {
  cardDef: CardDefinition!
  price: Int!
}

# ─── Inventory ────────────────────────────────────────────────────────────────

type InventoryItem {
  id: ID!
  name: String!
  type: String!
  value: Int!
  rarity: String!
  description: String!
}

type HeroInventory {
  heroId: ID!
  items: [InventoryItem!]!
}

# ─── Random Events ────────────────────────────────────────────────────────────

type EventChoice {
  id: ID!
  label: String!
  description: String!
}

type RandomEvent {
  id: ID!
  title: String!
  description: String!
  choices: [EventChoice!]!
}

type EventOutcome {
  choiceId: String!
  description: String!
  goldDelta: Int!
  hpDelta: Int!
}

# ─── Leaderboard ─────────────────────────────────────────────────────────────

# (Run type above serves as leaderboard entry)

# ─── Queries ─────────────────────────────────────────────────────────────────

type Query {
  me: User
  hero(id: ID!): Hero
  floorGraph(heroId: ID!): FloorGraph
  heroDeck(heroId: ID!): HeroDeck
  heroRelics(heroId: ID!): [Relic!]!
  encounterState(encounterId: ID!): EncounterState
  cardRewards(heroId: ID!): CardRewards!
  shopCards(heroId: ID!): ShopInventory!
  heroInventory(heroId: ID!): HeroInventory!
  randomEvent: RandomEvent!
  leaderboard: [Run!]!
}

# ─── Mutations ───────────────────────────────────────────────────────────────

type Mutation {
  # Hero lifecycle
  createHero(name: String!, class: HeroClass!): Hero!

  # Run / map
  startRun(heroId: ID!): FloorGraph!
  travelToNode(heroId: ID!, nodeId: ID!): FloorGraph!

  # Card combat
  startEncounter(heroId: ID!, nodeId: ID!): EncounterState!
  playCard(encounterId: ID!, heroId: ID!, cardId: ID!, targetId: ID): EncounterState!
  endTurn(encounterId: ID!, heroId: ID!): EncounterState!

  # Post-combat
  pickCardReward(encounterId: ID!, heroId: ID!, cardDefId: ID!): HeroDeck!
  skipCardReward(encounterId: ID!, heroId: ID!): Boolean!

  # Rest site
  rest(heroId: ID!, nodeId: ID!, action: String!): Hero!

  # Shop
  buyCard(heroId: ID!, cardDefId: ID!, price: Int!): Hero!

  # Inventory
  useItem(heroId: ID!, itemId: ID!): Boolean!

  # Events
  resolveEvent(heroId: ID!, eventId: ID!, choiceId: ID!): EventOutcome!

  # Leaderboard
  submitScore(heroId: ID!): Run!
}

# ─── Subscriptions ───────────────────────────────────────────────────────────

type Subscription {
  encounterUpdated(encounterId: ID!): EncounterState!
  heroUpdated(heroId: ID!): Hero!
}
